<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MavsReclaim — Sign In</title>
    <link rel="stylesheet" href="/HomeStyle.css">
</head>
<body>
    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="logo">
            <img src="/uta_logo.png" alt="University of Texas at Arlington">
        </div>
        <h1>MavsReclaim</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/faq">FAQ</a>
            <a th:if="${username != null}" href="/rewards">Rewards</a>
        </nav>
    </header>
    <!-- Main Content -->
    <main>
        <section class="welcome-box">
            <h2>Sign In</h2>
            <!-- action="/login" method="post" is what hits the POST route -->
            <form action="/login" method="post">
                <p>
                    <label for="username">Username</label><br>
                    <input type="text" id="username" name="username" required>
                </p>
                <p>
                    <label for="password">Password</label><br>
                    <input type="password" id="password" name="password" required>
                </p>
                <div class="action-buttons">
                    <button type="submit" class="item-button">Log In</button>
                </div>
            </form>
        </section>
    </main>
    <footer></footer>
</body>
</html>
