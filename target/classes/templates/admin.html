<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MavReclaim — Admin</title>

    <link rel="stylesheet" href="/HomeStyle.css">
    <link rel="stylesheet" href="/AdminStyle.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">

        <div class="logo">
            <img src="/uta_logo.png" alt="University of Texas at Arlington">
        </div>

        <h1>MavsReclaim</h1>

        <nav>
            <a href="/">Home</a>
            <a href="/faq">FAQ</a>
            <a th:if="${username != null}" href="/rewards">Rewards</a>
        </nav>

        <!-- Logged-in status — same component as the home page -->
        <div th:if="${username != null}" class="account-status">
            <span>Logged in as: <span th:text="${username}">username</span></span>
            <a href="/logout" class="logout-button">Log out</a>
        </div>

    </header>


    <main class="admin-main">

        <h2>Pending Lost Reports</h2>


        <table class="admin-table">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Description</th>
                    <th>Category</th>
                    <th>Building</th>
                    <th>Reported By</th>
                    <th>Reported On</th>
                    <th></th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="claim : ${claims}">
                    <td th:text="${claim.id}">1</td>
                    <td th:text="${claim.description}">iPhone 16 Plus</td>
                    <td th:text="${claim.category}">Phone</td>
                    <td th:text="${claim.building}">Nedderman Hall</td>
                    <td th:text="${claim.claimantEmail}">student1@mavs.uta.edu</td>
                    <td th:text="${claim.createdAt}">2026-07-28 10:14:02</td>
                    <td>
                        <a th:href="@{/admin/claim/{id}(id=${claim.id})}" href="#">Review</a>
                    </td>
                </tr>

                <tr th:if="${claims.isEmpty()}">
                    <td colspan="7" class="empty">No pending reports.</td>
                </tr>

            </tbody>

        </table>

    </main>


    <footer></footer>

</body>

</html>
