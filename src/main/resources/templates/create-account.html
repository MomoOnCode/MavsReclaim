<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MavsReclaim — Create Account</title>

    <link rel="stylesheet" href="/HomeStyle.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="logo">
            <img src="/uta_logo.png" alt="University of Texas at Arlington">
        </div>

        <h1>MavsReclaim</h1>

        <nav>
            <a href="/">Home</a>
            <a href="/faq">FAQ</a>
            <a th:if="${username != null}" href="/rewards">Rewards</a>
        </nav>
    </header>


    <!-- Main Content -->
    <main>

        <section class="welcome-box">

            <h2>Create Account</h2>

            <!-- action="/create" method="post" hits the POST /create route -->
            <form action="/create" method="post">

                <p>
                    <label for="username">Username</label><br>
                    <input type="text" id="username" name="username" required>
                </p>

                <p>
                    <label for="email">Email</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="password">Password</label><br>
                    <input type="password" id="password" name="password" required>
                </p>

                <div class="action-buttons">
                    <button type="submit" class="item-button">Create</button>
                </div>

            </form>

            <p>
                Already have an account?
                <a href="/signin">Sign-In</a>
            </p>

        </section>

    </main>


    <footer></footer>

</body>

</html>
