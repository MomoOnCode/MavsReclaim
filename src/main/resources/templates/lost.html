<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MavReclaim — Report a Lost Item</title>

    <link rel="stylesheet" href="/HomeStyle.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="logo">
            <img src="/uta_logo.png" alt="University of Texas at Arlington">
        </div>

        <h1>MavsReclaim</h1>

        <nav>
            <a href="/">Home</a>
            <a href="/faq">FAQ</a>
            <a href="/rewards">Rewards</a>
        </nav>
    </header>


    <main>

        <section class="welcome-box">

            <h2>Lost an Item?</h2>

            <p>Describe what you lost and where. An admin will check for matches.</p>

            <form action="/lost" method="post" enctype="multipart/form-data">

                <p>
                    <label for="description">Description</label><br>
                    <input type="text" id="description" name="description"
                           placeholder="e.g. Blue metal water bottle" required>
                </p>

                <p>
                    <label for="category">Category</label><br>
                    <select id="category" name="category" required>
                        <option value="" disabled selected>Choose a category</option>
                        <option th:each="c : ${categories}" th:value="${c}" th:text="${c}">Phone</option>
                    </select>
                </p>

                <p>
                    <label for="building">Building</label><br>
                    <select id="building" name="building" required>
                        <option value="" disabled selected>Choose a building</option>
                        <option th:each="b : ${buildings}" th:value="${b}" th:text="${b}">Nedderman Hall</option>
                    </select>
                </p>

                <p>
                    <label for="lostOn">Date Lost</label><br>
                    <input type="date" id="lostOn" name="lostOn" required>
                </p>

                <p>
                    <label for="email">Your Email</label><br>
                    <input type="email" id="email" name="email"
                           placeholder="you@mavs.uta.edu" required>
                </p>

                <p>
                    <label for="photo">Photo (optional)</label><br>
                    <input type="file" id="photo" name="photo" accept="image/*">
                </p>

                <div class="action-buttons">
                    <button type="submit" class="item-button">Submit</button>
                </div>

            </form>

        </section>

    </main>


    <footer></footer>

</body>

</html>
